name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PNG backend and CJK fallback fonts
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - name: Test algorithms and drawing API
        run: python3 -I scripts/test_render.py
      - name: Check public package
        run: python3 -I scripts/check_release.py
